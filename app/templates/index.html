<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>電子雞</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
  </head>
  <body>
    <main>
      <h1>我的電子雞</h1>
      <p id="message" aria-live="polite">正在讀取寵物狀態……</p>
      <section aria-label="寵物狀態">
        <p>飽食度：<span id="hunger">--</span></p>
        <p>心情：<span id="mood">--</span></p>
        <p>體力：<span id="energy">--</span></p>
        <p>清潔度：<span id="cleanliness">--</span></p>
        <p>狀態：<span id="status">--</span></p>
      </section>
      <section aria-label="文字交流">
        <h2>對話</h2>
        <ol id="conversation" aria-live="polite" aria-relevant="additions"></ol>
        <p>可輸入：餵食、玩耍、睡覺、清潔</p>
        <form id="command-form">
          <label for="command">輸入操作</label>
          <input id="command" name="command" autocomplete="off" required>
          <button type="submit">送出</button>
        </form>
      </section>
    </main>
  </body>
</html>
